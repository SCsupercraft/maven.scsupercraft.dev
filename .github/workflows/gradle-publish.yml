name: Publish Maven Artifact (Using Gradle)

on:
  workflow_call:
    inputs:
      java-version:
        description: The Java version to set up. Takes a whole or semver Java version.
        required: true
        type: string
      pre_gradle_tasks:
        description: 'The Gradle task(s) to run pre-publication'
        required: false
        type: string
        default: ''
      gradle_tasks:
        description: 'The Gradle task(s) to run at publication'
        required: false
        type: string
        default: 'publish'
    secrets:
      maven-repository-token:
        description: GitHub token with push permissions
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout Maven Repository
        uses: actions/checkout@v7
        with:
          repository: SCsupercraft/maven.scsupercraft.dev
          token: ${{ secrets.maven-repository-token }}
          path: maven-repo

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Gradle Pre-Publication Tasks
        if: inputs.pre_gradle_tasks
        run: |
          ./gradlew ${{ inputs.pre_gradle_tasks }}

      - name: Gradle Publication Tasks
        run: |
          ./gradlew ${{ inputs.gradle_tasks }}

      - name: Read Project Metadata
        shell: bash
        run: |
          echo "NAME=$(./gradlew properties -q | awk '/^name:/ {print $2}')" >> $GITHUB_ENV
          echo "VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')" >> $GITHUB_ENV

      - name: Commit & Push Changes
        shell: bash
        working-directory: maven-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Publish $NAME Version $VERSION"
          git push origin main
